
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zaanstraat — Visualising a New Neighbourhood — Sophie Deahl</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fafafa;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* HEADER */

    .landing {
      min-height: 0;
      display: flex;
      align-items: center;
      padding: 28px 5.5% 0;
    }

    .landing-inner {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
    }

    .landing-line {
      width: 100%;
      height: 1px;
      background: #aaa;
    }

    .landing-row {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 40px;
      padding: 50px 5px;
    }

    .landing .identity {
      font-size: clamp(30px, 4vw, 60px);
      line-height: 1.12;
      letter-spacing: -.055em;
      flex-shrink: 0;
    }

    .landing-nav {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      min-width: 0;
      text-align: right;
    }

    .landing-nav a {
      font-size: clamp(30px, 3.5vw, 54px);
      font-weight: 700;
      font-style: normal;
      letter-spacing: -.05em;
      line-height: 1.12;
      white-space: nowrap;
      cursor: pointer;
      color: inherit;
      text-decoration: none;
    }

    .landing-nav a:hover,
    .landing-nav a:focus-visible {
      font-weight: 400;
      font-style: italic;
    }

    /* PROJECT CONTENT */

    .project-content {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
      padding: 30px 5.5% 110px;
    }

    /* HERO IMAGE */

    .project-hero {
      position: relative;
      width: 100%;
      height: clamp(400px, 44vw, 620px);
      overflow: hidden;
      background: #e9ece7;
      isolation: isolate;
    }

    .project-hero > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .project-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(250, 250, 250, .68) 0%,
        rgba(250, 250, 250, .32) 42%,
        rgba(250, 250, 250, 0) 75%
      );
      z-index: 1;
      pointer-events: none;
    }

    .project-hero-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: clamp(24px, 3vw, 45px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
    }

    .project-title {
      max-width: 850px;
      margin: 0;
      font-size: clamp(42px, 5.7vw, 86px);
      font-weight: 700;
      font-style: italic;
      line-height: .98;
      letter-spacing: -.065em;
    }

    /* DESCRIPTION AND IMAGE GRID */

    .project-details {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 6%;
      align-items: start;
      padding-top: 35px;
    }

    .project-copy {
      min-width: 0;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px 24px;
      font-size: 17px;
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .project-year {
      font-weight: 700;
    }

    .project-copy a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .project-copy a:hover {
      font-style: italic;
    }

    .project-rule {
      width: 100%;
      height: 1px;
      background: #bbb;
      margin-bottom: 28px;
    }

    .project-copy p {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(18px, 1.5vw, 21px);
      font-weight: 400;
      line-height: 1.38;
      letter-spacing: -.025em;
      text-align: justify;
      hyphens: none;
      margin: 0 0 26px;
    }

    .project-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
      min-width: 0;
    }

    .project-gallery a {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      background: transparent;
      cursor: zoom-in;
    }

    .project-gallery img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .25s ease;
    }

    .project-gallery a:hover img {
      transform: scale(1.025);
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .landing {
        padding: 25px 5% 0;
      }

      .landing-row {
        flex-direction: column;
        gap: 50px;
        padding: 35px 5px;
      }

      .landing .identity {
        font-size: clamp(26px, 6vw, 40px);
      }

      .landing-nav {
        align-items: flex-start;
        text-align: left;
        gap: 25px;
      }

      .landing-nav a {
        font-size: clamp(26px, 6vw, 40px);
      }

      .project-content {
        padding: 22px 5% 70px;
      }

      .project-hero {
        height: 480px;
      }

      .project-hero::after {
        background: linear-gradient(
          0deg,
          rgba(250, 250, 250, .78) 0%,
          rgba(250, 250, 250, .18) 75%
        );
      }

      .project-hero-content {
        padding: 20px;
      }

      .project-title {
        font-size: clamp(35px, 8vw, 56px);
        max-width: 100%;
      }

      .project-details {
        grid-template-columns: 1fr;
        gap: 28px;
        padding-top: 28px;
      }

      .project-copy p {
        font-size: 18px;
      }

      .project-gallery {
        gap: 12px;
      }
    }
  </style>

</head>

<body>

  <!-- HEADER -->

  <header class="landing">
    <div class="landing-inner">

      <div class="landing-line"></div>

      <div class="landing-row">

        <a class="identity" href="index.html">
          <strong>SOPHIE DEAHL</strong>
          <em>2026 PORTFOLIO</em>
          <span>URBAN RESEARCHER<br>&amp; DESIGNER</span>
        </a>

        <nav class="landing-nav" aria-label="Main navigation">
          <a href="index.html#about">ABOUT ME</a>
          <a href="index.html#projects">PROJECTS</a>
        </nav>

      </div>

      <div class="landing-line"></div>

    </div>
  </header>

  <!-- PROJECT CONTENT -->

  <main class="project-content">

    <!-- HERO -->

    <section class="project-hero">

      <img
        src="assets/msc-4.png"
        alt="Zaanstraat — Visualising a New Neighbourhood"
      >

      <div class="project-hero-content">
        <h1 class="project-title">
          Zaanstraat — Visualising a New Neighbourhood
        </h1>
      </div>

    </section>

    <!-- DESCRIPTION AND IMAGES -->

    <section class="project-details">

      <!-- LEFT COLUMN -->

      <div class="project-copy">

        <div class="project-meta">

          <span class="project-year">YEAR</span>

          <span>
            <a
              href="https://www.ams-institute.org/education/msc-metropolitan-analysis-design-and-engineering/"
              target="_blank"
              rel="noopener noreferrer"
            >MSc MADE</a>
          </span>

        </div>

        <div class="project-rule"></div>

        <p>
          Project description to be added.
        </p>

      </div>

      <!-- RIGHT COLUMN -->

      <div class="project-gallery">

        <a
          href="assets/msc4-small1.png"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open first Zaanstraat visualisation image"
        >
          <img
            src="assets/msc4-small1.png"
            alt="Zaanstraat — image 1"
          >
        </a>

        <a
          href="assets/msc4-small2.png"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open second Zaanstraat visualisation image"
        >
          <img
            src="assets/msc4-small2.png"
            alt="Zaanstraat — image 2"
          >
        </a>

      </div>

    </section>

  </main>

</body>
</html>
