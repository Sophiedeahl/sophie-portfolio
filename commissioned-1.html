
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobility Hub Research — Sophie Deahl</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #fafafa;
      color: #111;
    }

    /* SAME HEADER AS THE MAIN PORTFOLIO */

    .landing {
      padding: 28px 5.5% 0;
    }

    .landing-inner {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
    }

    .landing-line {
      width: 100%;
      height: 1px;
      background: #aaa;
    }

    .landing-row {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 40px;
      padding: 50px 5px;
    }

    .landing .identity {
      font-size: clamp(30px, 4vw, 60px);
      line-height: 1.12;
      letter-spacing: -.055em;
      flex-shrink: 0;
    }

    .landing-nav {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      min-width: 0;
      text-align: right;
    }

    .landing-nav a {
      font-size: clamp(30px, 3.5vw, 54px);
      font-weight: 700;
      font-style: normal;
      letter-spacing: -.05em;
      line-height: 1.12;
      white-space: nowrap;
      cursor: pointer;
    }

    .landing-nav a:hover,
    .landing-nav a:focus-visible {
      font-weight: 400;
      font-style: italic;
    }

    /* PROJECT CONTENT */

    .project-content {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
      padding: 28px 5.5% 80px;
    }

    .project-image {
      display: block;
      width: 100%;
      max-width: 1150px;
      height: auto;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .landing {
        padding: 25px 5% 0;
      }

      .landing-row {
        flex-direction: column;
        gap: 50px;
        padding: 35px 5px;
      }

      .landing .identity {
        font-size: clamp(26px, 6vw, 40px);
      }

      .landing-nav {
        align-items: flex-start;
        text-align: left;
        gap: 25px;
      }

      .landing-nav a {
        font-size: clamp(26px, 6vw, 40px);
      }

      .project-content {
        padding: 20px 5% 50px;
      }
    }
  </style>
</head>

<body>
  <main>

    <!-- SAME HEADER AS INDEX.HTML -->

    <section class="landing">
      <div class="landing-inner">

        <div class="landing-line"></div>

        <div class="landing-row">

          <a class="identity" href="index.html">
            <strong>SOPHIE DEAHL</strong>
            <em>2026 PORTFOLIO</em>
            <span>URBAN RESEARCHER<br>& DESIGNER</span>
          </a>

          <nav class="landing-nav" aria-label="Main navigation">
            <a href="index.html#about">ABOUT ME</a>
            <a href="index.html#projects">PROJECTS</a>
          </nav>

        </div>

        <div class="landing-line"></div>

      </div>
    </section>

    <!-- MOBILITY HUB PROJECT -->

    <section class="project-content">
      <img
        class="project-image"
        src="assets/commissioned-1-page.png"
        alt="Mobility Hub research for Municipality of Utrecht"
      >
    </section>

  </main>
</body>
</html>
