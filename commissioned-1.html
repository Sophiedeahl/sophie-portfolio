
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mobility Hub Research — Sophie Deahl</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #fafafa;
      color: #111;
    }

    .project-page {
      max-width: 1700px;
      margin: 0 auto;
      padding: 28px 5.5% 80px;
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
      border-top: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
    }

    .project-header a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(16px, 2vw, 26px);
      letter-spacing: -.04em;
    }

    .project-header a:hover {
      font-weight: 400;
      font-style: italic;
    }

    .project-content {
      max-width: 1150px;
      margin: 35px auto 0;
    }

    .project-image {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 700px) {
      .project-page {
        padding: 20px 5% 50px;
      }

      .project-header a {
        font-size: 16px;
      }

      .project-content {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="project-page">

    <header class="project-header">

      <a href="index.html">
        SOPHIE DEAHL
      </a>

      <a href="index.html#projects">
        BACK TO PROJECTS
      </a>

    </header>

    <div class="project-content">

      <img
        class="project-image"
        src="assets/commissioned-1-page.png"
        alt="Mobility Hub research for Municipality of Utrecht, including project description, maps and research process"
      >

    </div>

  </main>

</body>
</html>
