
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sophie Deahl — 2026 Portfolio</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .landing {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 6.3% 5.5%;
    }

    .landing-inner {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
    }

    .landing-line {
      width: 100%;
      height: 1px;
      background: #aaa;
    }

    .landing-row {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 40px;
      padding: 50px 5px;
    }

    .landing .identity {
      font-size: clamp(30px, 4vw, 60px);
      line-height: 1.12;
      letter-spacing: -.055em;
    }

    .landing-nav {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      min-width: 37%;
    }

    .landing-nav a {
      font-size: clamp(30px, 3.5vw, 54px);
      font-weight: 700;
      font-style: normal;
      letter-spacing: -.05em;
      line-height: 1.12;
      white-space: nowrap;
    }

    .landing-nav a:hover,
    .landing-nav a:focus-visible {
      font-weight: 400;
      font-style: italic;
    }

    @media (max-width: 700px) {
      .landing {
        padding: 8% 5%;
      }

      .landing-row {
        flex-direction: column;
        gap: 50px;
        padding: 35px 5px;
      }

      .landing .identity {
        font-size: clamp(26px, 6vw, 40px);
      }

      .landing-nav {
        min-width: 0;
        gap: 25px;
      }

      .landing-nav a {
        font-size: clamp(26px, 6vw, 40px);
      }
    }
  </style>
</head>

<body>

  <main class="landing">
    <div class="landing-inner">

      <div class="landing-line"></div>

      <div class="landing-row">

        <a class="identity" href="index.html">
          <strong>SOPHIE DEAHL</strong>
          <em>2026 PORTFOLIO</em>
          <span>URBAN RESEARCHER<br>& DESIGNER</span>
        </a>

        <nav class="landing-nav" aria-label="Main navigation">
          <a href="resume.html">ABOUT ME</a>
          <a href="projects.html">PROJECTS</a>
        </nav>

      </div>

      <div class="landing-line"></div>

    </div>
  </main>

</body>
</html>
