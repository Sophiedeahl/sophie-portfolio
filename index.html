<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sophie Deahl — 2026 Portfolio</title>

  <link rel="stylesheet" href="style.css">

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fafafa;
      color: #111;
      font-family: 'Arimo', Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    /* COMPACT HEADER */

    .landing {
      min-height: 0;
      display: flex;
      align-items: center;
      padding: 35px 5.5% 0;
    }

    .landing.open {
      min-height: 0;
      padding-top: 35px;
      padding-bottom: 0;
    }

    .landing-inner {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .landing-line {
      width: 100%;
      height: 1px;
      background: #aaa;
    }

    .landing-row {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 40px;
      padding: 26px 5px;
    }

    .landing .identity {
      font-size: clamp(24px, 2.35vw, 34px);
      line-height: 1.12;
      letter-spacing: -.055em;
      flex-shrink: 0;
      color: inherit;
      text-decoration: none;
    }

    .landing .identity strong,
    .landing .identity em,
    .landing .identity span {
      display: block;
    }

    .landing .identity strong {
      font-weight: 700;
      font-style: normal;
    }

    .landing .identity em {
      font-weight: 400;
      font-style: italic;
    }

    .landing .identity span {
      font-weight: 400;
      font-style: normal;
    }

    .landing-nav {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      min-width: 0;
      text-align: right;
    }

    .landing-nav a {
      font-size: clamp(23px, 2.2vw, 32px);
      font-weight: 700;
      font-style: normal;
      letter-spacing: -.05em;
      line-height: 1.12;
      white-space: nowrap;
      cursor: pointer;
      color: inherit;
      text-decoration: none;
    }

    .landing-nav a:hover,
    .landing-nav a:focus-visible,
    .landing-nav a.active {
      font-weight: 400;
      font-style: italic;
    }

    /* CONTENT SECTIONS */

    .content-section {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
      padding: 20px 5.5% 70px;
      display: none;
      animation: fadeIn .65s ease;
    }

    .content-section.visible {
      display: block;
    }

    /* ABOUT ME */

    #about {
      max-width: none;
      padding-top: 45px;
      padding-left: 5.5%;
      padding-right: 5.5%;
    }

    .about-layout {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
      background: #f8f8f8;
      display: grid;
      grid-template-columns:
        minmax(0, 1.08fr)
        minmax(0, 1.38fr)
        minmax(0, .72fr);
      column-gap: 5.5%;
      align-items: start;
      padding: 30px 4% 70px;
    }

    /* LEFT COLUMN: PORTRAIT AND CONTACT */

    .about-left {
      min-width: 0;
      padding-top: 10px;
    }

    .about-photo {
      display: block;
      width: 100%;
      max-width: 390px;
      aspect-ratio: .92;
      height: auto;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
      background: #e9e9e6;
    }

      padding: 24px
