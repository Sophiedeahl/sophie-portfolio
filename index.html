
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sophie Deahl — 2026 Portfolio</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="identity" href="index.html"><strong>SOPHIE DEAHL</strong><em>2026 PORTFOLIO</em><span>URBAN RESEARCHER<br>& DESIGNER</span></a><a class="resume-link" href="resume.html">RESUME</a></header><main><section class="projects" aria-label="Projects" id="projects"></section></main><footer>© 2026 SOPHIE DEAHL</footer><script src="projects.js"></script><script>
const grid = document.getElementById('projects');
for (const category of ['Commissioned Projects', 'MSc Projects', 'Other Projects']) {
  const group = document.createElement('div');
  group.className = 'project-group';
  const heading = document.createElement('h2');
  heading.textContent = category.toUpperCase();
  group.appendChild(heading);
  const tiles = document.createElement('div');
  tiles.className = 'project-grid';
  for (const p of projects.filter(project => project.category === category)) {
    const a = document.createElement('a');
    a.className = 'project';
    a.href = 'project.html?id=' + encodeURIComponent(p.id);
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = p.image;
    img.alt = p.title;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const title = document.createElement('span');
    title.textContent = p.title;
    overlay.appendChild(title);
    thumb.append(img, overlay);
    a.appendChild(thumb);
    tiles.appendChild(a);
  }
  group.appendChild(tiles);
  grid.appendChild(group);
}
</script></body></html>
