
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sophie Deahl — 2026 Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="site-container">

    <header class="site-header">
      <a class="identity" href="index.html">
        <strong>SOPHIE DEAHL</strong>
        <em>2026 PORTFOLIO</em>
        <span>URBAN RESEARCHER<br>& DESIGNER</span>
      </a>

      <a class="resume-link" href="resume.html">RESUME</a>
    </header>

    <main>
      <section
        class="projects"
        id="projects"
        aria-label="Portfolio projects">
      </section>
    </main>

    <footer>© 2026 SOPHIE DEAHL</footer>

  </div>

  <script src="projects.js"></script>

  <script>
    const grid = document.getElementById('projects');

    // Display all projects in one continuous grid.
    for (const p of projects) {

      const link = document.createElement('a');
      link.className = 'project';
      link.href = 'project.html?id=' + encodeURIComponent(p.id);
      link.setAttribute('aria-label', p.title);

      const thumb = document.createElement('div');
      thumb.className = 'thumb';

      const img = document.createElement('img');
      img.src = p.image;
      img.alt = p.title;
      img.loading = 'lazy';

      const overlay = document.createElement('div');
      overlay.className = 'overlay';

      const title = document.createElement('span');
      title.textContent = p.title;

      overlay.appendChild(title);
      thumb.append(img, overlay);
      link.appendChild(thumb);
      grid.appendChild(link);
    }
  </script>

</body>
</html>
