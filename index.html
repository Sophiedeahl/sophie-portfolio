
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sophie Deahl — 2026 Portfolio</title>
  <link rel="stylesheet" href="style.css">

  <style>
    html {
      scroll-behavior: smooth;
    }

    .landing {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 6.3% 5.5%;
      transition: min-height .7s ease, padding .7s ease;
    }

    .landing.open {
      min-height: 0;
      padding-top: 28px;
      padding-bottom: 0;
    }

    .landing-inner {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
    }

    .landing-line {
      width: 100%;
      height: 1px;
      background: #aaa;
    }

    .landing-row {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 40px;
      padding: 50px 5px;
    }

    .landing .identity {
      font-size: clamp(30px, 4vw, 60px);
      line-height: 1.12;
      letter-spacing: -.055em;
      flex-shrink: 0;
    }

    .landing-nav {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      min-width: 0;
      text-align: right;
    }

    .landing-nav a {
      font-size: clamp(30px, 3.5vw, 54px);
      font-weight: 700;
      font-style: normal;
      letter-spacing: -.05em;
      line-height: 1.12;
      white-space: nowrap;
      cursor: pointer;
    }

    .landing-nav a:hover,
    .landing-nav a:focus-visible,
    .landing-nav a.active {
      font-weight: 400;
      font-style: italic;
    }

    .content-section {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
      padding: 20px 5.5% 70px;
      display: none;
      animation: fadeIn .65s ease;
    }

    .content-section.visible {
      display: block;
    }

    /* ABOUT ME IMAGE */

    #about {
      max-width: none;
      padding-top: 65px;
      padding-left: 5.5%;
      padding-right: 5.5%;
    }

    .about-image-frame {
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
    }

    .about-image {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 0;
    }

    /* PROJECT GRID */

    .content-section .projects {
      padding: 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .landing {
        padding: 8% 5%;
      }

      .landing.open {
        padding-top: 25px;
        padding-bottom: 0;
      }

      .landing-row {
        flex-direction: column;
        gap: 50px;
        padding: 35px 5px;
      }

      .landing .identity {
        font-size: clamp(26px, 6vw, 40px);
      }

      .landing-nav {
        align-items: flex-start;
        text-align: left;
        gap: 25px;
      }

      .landing-nav a {
        font-size: clamp(26px, 6vw, 40px);
      }

      .content-section {
        padding: 20px 5% 50px;
      }

      #about {
        padding-top: 65px;
        padding-left: 5%;
        padding-right: 5%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .landing {
        transition: none;
      }

      .content-section {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main>

    <!-- HOMEPAGE / HEADER -->

    <section class="landing" id="landing">
      <div class="landing-inner">

        <div class="landing-line"></div>

        <div class="landing-row">

          <a class="identity" href="index.html" id="home-link">
            <strong>SOPHIE DEAHL</strong>
            <em>2026 PORTFOLIO</em>
            <span>URBAN RESEARCHER<br>& DESIGNER</span>
          </a>

          <nav class="landing-nav" aria-label="Main navigation">
            <a href="#about" id="about-link">ABOUT ME</a>
            <a href="#projects" id="projects-link">PROJECTS</a>
          </nav>

        </div>

        <div class="landing-line"></div>

      </div>
    </section>

    <!-- ABOUT ME -->

    <section class="content-section" id="about" aria-label="About Me">
      <div class="about-image-frame">
        <img
          class="about-image"
          src="assets/resume.png"
          alt="About Me — Sophie Deahl"
        >
      </div>
    </section>

    <!-- PROJECTS -->

    <section class="content-section" id="projects" aria-label="Projects">
      <div class="projects" id="project-grid"></div>
    </section>

  </main>

  <script src="projects.js"></script>

  <script>
    const landing = document.getElementById('landing');
    const aboutSection = document.getElementById('about');
    const projectsSection = document.getElementById('projects');
    const aboutLink = document.getElementById('about-link');
    const projectsLink = document.getElementById('projects-link');
    const homeLink = document.getElementById('home-link');
    const grid = document.getElementById('project-grid');

    // Build the existing project grid.

    for (const p of projects) {
      const a = document.createElement('a');
      a.className = 'project';

      // Mobility Hub opens its own dedicated project page.
      // All other projects keep their existing links.

      a.href = p.id === 'mobility-hub'
        ? 'commissioned-1.html'
        : 'project.html?id=' + encodeURIComponent(p.id);

      const thumb = document.createElement('div');
      thumb.className = 'thumb';

      const img = document.createElement('img');
      img.src = p.image;
      img.alt = p.title;

      const overlay = document.createElement('div');
      overlay.className = 'overlay';

      const title = document.createElement('span');
      title.textContent = p.title;

      overlay.appendChild(title);
      thumb.append(img, overlay);
      a.appendChild(thumb);
      grid.appendChild(a);
    }

    // Open About Me or Projects.

    function showSection(section) {
      landing.classList.add('open');

      aboutSection.classList.toggle(
        'visible',
        section === 'about'
      );

      projectsSection.classList.toggle(
        'visible',
        section === 'projects'
      );

      aboutLink.classList.toggle(
        'active',
        section === 'about'
      );

      projectsLink.classList.toggle(
        'active',
        section === 'projects'
      );

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    // Smoothly return to the homepage.

    function showHome() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

      aboutSection.classList.remove('visible');
      projectsSection.classList.remove('visible');

      aboutLink.classList.remove('active');
      projectsLink.classList.remove('active');

      landing.classList.remove('open');
    }

    // About Me navigation.

    aboutLink.addEventListener('click', function(event) {
      event.preventDefault();

      history.pushState(null, '', '#about');
      showSection('about');
    });

    // Projects navigation.

    projectsLink.addEventListener('click', function(event) {
      event.preventDefault();

      history.pushState(null, '', '#projects');
      showSection('projects');
    });

    // Homepage navigation.

    homeLink.addEventListener('click', function(event) {
      event.preventDefault();

      history.pushState(null, '', location.pathname);
      showHome();
    });

    // Browser back and forward buttons.

    window.addEventListener('popstate', function() {
      const section = location.hash.replace('#', '');

      if (section === 'about' || section === 'projects') {
        showSection(section);
      } else {
        showHome();
      }
    });

    // Open a section directly from a link.

    const initialSection = location.hash.replace('#', '');

    if (initialSection === 'about' || initialSection === 'projects') {
      showSection(initialSection);
    }
  </script>

</body>
</html>
